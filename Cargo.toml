[package]
name = "promt"
version = "0.1.0"
edition = "2024"

[dependencies]
llm = { version = "1.3", default-features = false, features = [
  "openai", "anthropic", "google", "ollama", "deepseek", "xai",
  "groq", "azure_openai", "bedrock", "openrouter", "cohere",
  "mistral", "huggingface", "phind", "default-tls"
] }
toml = "0.8"
ratatui = { version = "0.30", default-features = true }
crossterm = "0.29"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
pulldown-cmark = "0.13"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
arboard = "3"
nucleo = "0.5"
unicode-width = "0.2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
